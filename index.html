<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Flash Tools - Compresor ZIP</title>
    <!-- Librería JSZip para comprimir en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; text-align: center; padding: 50px; margin: 0; }
        .container { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 20px 0; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        /* Estilos del Modal de Anuncios */
        #adModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .ad-content { background: white; padding: 25px; border-radius: 10px; text-align: center; max-width: 400px; width: 90%; }
        .ad-box { background: #eee; height: 150px; margin: 15px 0; display: flex; align-items: center; justify-content: center; color: #666; font-weight: bold; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Data Flash Tools ⚡</h2>
        <p>Sube tus archivos y comprímelos al instante en un ZIP.</p>
        
        <input type="file" id="fileInput" multiple><br>
        <button onclick="prepararDescarga()">Comprimir y Descargar ZIP</button>
    </div>

    <!-- Modal de Publicidad Obligatoria -->
    <div id="adModal">
        <div class="ad-content">
            <h3>Publicidad Patrocinada</h3>
            <p>Tu descarga estará lista en <span id="countdown">5</span> segundos...</p>
            <!-- Aquí iría el código de tu red de anuncios (AdSense, etc.) -->
            <div class="ad-box">
                [Espacio para Anuncio / Banner]
            </div>
            <button id="closeAdBtn" disabled style="background:#ccc; cursor:not-allowed;">Cerrar y Descargar</button>
        </div>
    </div>

    <script>
        let archivosGlobales = null;

        function prepararDescarga() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                alert("Por favor, selecciona al menos un archivo primero.");
                return;
            }
            
            archivosGlobales = fileInput.files;
            
            // Mostrar modal de anuncios
            const modal = document.getElementById('adModal');
            modal.style.display = 'flex';
            
            let segundos = 5;
            const contadorSpan = document.getElementById('countdown');
            const botonCerrar = document.getElementById('closeAdBtn');
            
            contadorSpan.textContent = segundos;
            botonCerrar.disabled = true;
            botonCerrar.style.background = '#ccc';
            botonCerrar.style.cursor = 'not-allowed';

            // Cuenta atrás del anuncio
            const intervalo = setInterval(() => {
                segundos--;
                contadorSpan.textContent = segundos;
                
                if (segundos <= 0) {
                    clearInterval(intervalo);
                    contadorSpan.parentElement.textContent = "¡Publicidad finalizada!";
                    botonCerrar.disabled = false;
                    botonCerrar.style.background = '#28a745';
                    botonCerrar.style.cursor = 'pointer';
                    botonCerrar.onclick = function() {
                        modal.style.display = 'none';
                        ejecutarCompresionZip();
                    };
                }
            }, 1000);
        }

        async function ejecutarCompresionZip() {
            const zip = new JSZip();
            for (let i = 0; i < archivosGlobales.length; i++) {
                zip.file(archivosGlobales[i].name, archivosGlobales[i]);
            }

            const content = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(content);
            const a = document.createElement("a");
            a.href = url;
            a.download = "dataflash-comprimido.zip";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            console.log("¡ZIP generado y descargado con éxito tras ver el anuncio!");
        }
    </script>
