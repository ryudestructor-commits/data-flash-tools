<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Flash Tools - Compresor ZIP</title>
    <!-- Librería JSZip para comprimir en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0f19; color: #ffffff; text-align: center; padding: 30px; margin: 0; }
        .container { background: #131b2e; max-width: 500px; margin: 40px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #1f293d; }
        h2 { color: #38bdf8; }
        p { color: #94a3b8; }
        input[type="file"] { margin: 20px 0; color: #fff; background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid #334155; width: 100%; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        /* Estilos del Modal de Anuncios */
        #adModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; }
        .ad-content { background: #131b2e; border: 1px solid #1f293d; padding: 25px; border-radius: 12px; text-align: center; max-width: 400px; width: 90%; color: #fff; }
        .ad-box { background: #1e293b; min-height: 250px; margin: 15px 0; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; border-radius: 6px; overflow: hidden; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Data Flash Tools ⚡</h2>
        <p>Sube tus archivos y comprímelos de forma ultrarrápida en un ZIP.</p>
        
        <input type="file" id="fileInput" multiple><br>
        <button onclick="prepararDescarga()">Comprimir y Descargar ZIP</button>
    </div>

    <!-- Modal de Publicidad Adsterra -->
    <div id="adModal">
        <div class="ad-content">
            <h3>Publicidad Patrocinada</h3>
            <p>Tu descarga estará lista en <span id="countdown" style="color: #38bdf8; font-weight: bold;">5</span> segundos...</p>
            
            <!-- Banner integrado de Adsterra -->
            <div class="ad-box" id="adContainer">
                <script type="text/javascript">
                    atOptions = {
                        'key' : 'tus-datos-de-adsterra',
                        'format' : 'iframe',
                        'height' : 250,
                        'width' : 300,
                        'params' : {}
                    };
                </script>
                <span>Espacio publicitario optimizado</span>
            </div>

            <button id="closeAdBtn" disabled style="background:#334155; color:#94a3b8; cursor:not-allowed;">Cerrar y Descargar</button>
        </div>
    </div>

    <script>
        let archivosGlobales = null;

        function prepararDescarga() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                alert("Por favor, selecciona al menos un archivo primero.");
                return;
            }
            
            archivosGlobales = fileInput.files;
            
            const modal = document.getElementById('adModal');
            modal.style.display = 'flex';
            
            let segundos = 5;
            const contadorSpan = document.getElementById('countdown');
            const botonCerrar = document.getElementById('closeAdBtn');
            
            contadorSpan.textContent = segundos;
            botonCerrar.disabled = true;
            botonCerrar.style.background = '#334155';
            botonCerrar.style.color = '#94a3b8';
            botonCerrar.style.cursor = 'not-allowed';

            const intervalo = setInterval(() => {
                segundos--;
                contadorSpan.textContent = segundos;
                
                if (segundos <= 0) {
                    clearInterval(intervalo);
                    contadorSpan.parentElement.textContent = "¡Publicidad finalizada!";
                    botonCerrar.disabled = false;
                    botonCerrar.style.background = '#0284c7';
                    botonCerrar.style.color = '#ffffff';
                    botonCerrar.style.cursor = 'pointer';
                    botonCerrar.onclick = function() {
                        modal.style.display = 'none';
                        ejecutarCompresionZip();
                    };
                }
            }, 1000);
        }

        async function ejecutarCompresionZip() {
            const zip = new JSZip();
            for (let i = 0; i < archivosGlobales.length; i++) {
                zip.file(archivosGlobales[i].name, archivosGlobales[i]);
            }

            const content = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(content);
            const a = document.createElement("a");
            a.href = url;
            a.download = "dataflash-comprimido.zip";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

</body>
</html>
