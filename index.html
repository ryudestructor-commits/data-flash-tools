<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Flash Tools - Compresor ZIP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0f19; color: #ffffff; text-align: center; padding: 30px; margin: 0; }
        .container { background: #131b2e; max-width: 500px; margin: 40px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #1f293d; }
        h2 { color: #38bdf8; }
        p { color: #94a3b8; }
        input[type="file"] { margin: 20px 0; color: #fff; background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid #334155; width: 100%; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        
        #adModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; }
        .ad-content { background: #131b2e; border: 1px solid #1f293d; padding: 25px; border-radius: 12px; text-align: center; max-width: 400px; width: 90%; color: #fff; }
        .ad-box { background: #1e293b; min-height: 200px; margin: 15px 0; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; border-radius: 6px; overflow: hidden; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Data Flash Tools ⚡</h2>
        <p>Sube tus archivos y comprímelos de forma ultrarrápida en un ZIP.</p>
        
        <input type="file" id="fileInput" multiple><br>
        <button onclick="iniciarProceso()">Comprimir y Descargar ZIP</button>
    </div>

    <!-- Modal de Publicidad -->
    <div id="adModal">
        <div class="ad-content">
            <h3 id="adTitle">Publicidad Patrocinada (1/3)</h3>
            <p id="statusText">Tu descarga estará lista en <span id="countdown" style="color: #38bdf8; font-weight: bold;">30</span> segundos...</p>
            
            <div class="ad-box" id="adContainer">
                <span>Espacio publicitario 1</span>
            </div>

            <button id="closeAdBtn" disabled style="background:#334155; color:#94a3b8; cursor:not-allowed;">Por favor, espere...</button>
        </div>
    </div>

    <script>
        let archivosGlobales = null;
        let faseAnuncio = 1;
        let intervaloActual = null;

        function iniciarProceso() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                alert("Por favor, selecciona al menos un archivo primero.");
                return;
            }
            
            archivosGlobales = fileInput.files;
            faseAnuncio = 1;
            iniciarFaseAnuncio();
        }

        function iniciarFaseAnuncio() {
            const modal = document.getElementById('adModal');
            modal.style.display = 'flex';
            
            let segundos = 30;
            const statusText = document.getElementById('statusText');
            statusText.innerHTML = `Tu descarga estará lista en <span id="countdown" style="color: #38bdf8; font-weight: bold;">30</span> segundos...`;
            
            const botonCerrar = document.getElementById('closeAdBtn');
            const tituloAnuncio = document.getElementById('adTitle');
            const cajaAnuncio = document.getElementById('adContainer');
            
            if (intervaloActual) clearInterval(intervaloActual);
            
            tituloAnuncio.textContent = `Publicidad Patrocinada (${faseAnuncio}/3)`;
            cajaAnuncio.innerHTML = `<span>Espacio publicitario ${faseAnuncio}</span>`;
            
            botonCerrar.disabled = true;
            botonCerrar.style.background = '#334155';
            botonCerrar.style.color = '#94a3b8';
            botonCerrar.style.cursor = 'not-allowed';
            botonCerrar.textContent = "Por favor, espere...";

            intervaloActual = setInterval(() => {
                segundos--;
                const spanActivo = document.getElementById('countdown');
                if (spanActivo) {
                    spanActivo.textContent = segundos;
                }
                
                if (segundos <= 0) {
                    clearInterval(intervaloActual);
                    
                    if (faseAnuncio < 3) {
                        statusText.textContent = "¡Cargando siguiente anuncio automáticamente...";
                        setTimeout(() => {
                            faseAnuncio++;
                            iniciarFaseAnuncio();
                        }, 1000);
                    } else {
                        statusText.textContent = "¡Proceso finalizado con éxito!";
                        modal.style.display = 'none';
                        ejecutarCompresionZip();
                    }
                }
            }, 1000);
        }

        async function ejecutarCompresionZip() {
            const zip = new JSZip();
            for (let i = 0; i < archivosGlobales.length; i++) {
                zip.file(archivosGlobales[i].name, archivosGlobales[i]);
            }

            const content = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(content);
            const a = document.createElement("a");
            a.href = url;
            a.download = "dataflash-comprimido.zip";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

    <script type="text/javascript" src="//pl25732158.highperformancegate.com/00/51/d7/0051d7e21a2e7c9f807cb9b6cbef4516.js"></script>
</body>
</html>
